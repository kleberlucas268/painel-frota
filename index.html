<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
 
  :root{
    --brand-green:#1C9B5E; --brand-blue:#1663A6; --brand-gold:#F2A900;
    --st-green:#2FAE66; --st-orange:#E8721C; --st-red:#D8483B; --st-gray:#8A938C; --st-blue:#2E7FC1; --st-yellow:#EFAA1C;
    --radius:14px; --radius-sm:9px;
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-alt:#F3F5F1; --border:#E4E9E0; --text:#16211C; --text-muted:#5C6C61;
    --shadow: 0 1px 2px rgba(20,30,22,.04), 0 8px 24px -12px rgba(20,30,22,.12);
  }
  [data-theme="dark"]{ --bg:#0E1512; --surface:#161F1A; --surface-alt:#1D2921; --border:#2A3A31; --text:#EAF1EB; --text-muted:#93A69A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5); }
  *{box-sizing:border-box;}
  .bf-root{font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex;}
  .bf-root .mono{font-family:'IBM Plex Mono',monospace;} .bf-root .display{font-family:'Space Grotesk',sans-serif;}
 
  .bf-sidebar{width:216px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:18px 12px; gap:4px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .bf-brand{display:flex; align-items:center; gap:10px; padding:6px 8px 18px 8px;}
  .bf-brand-mark{width:26px;height:30px; flex-shrink:0;}
  .bf-brand-text{font-family:'Space Grotesk'; font-weight:700; font-size:15px; line-height:1.1;}
  .bf-brand-text span{display:block; font-family:'Inter'; font-weight:500; font-size:10px; letter-spacing:.06em; color:var(--text-muted); text-transform:uppercase; margin-top:2px;}
  .bf-nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:500; color:var(--text-muted); cursor:pointer; border:none; background:none; width:100%; text-align:left;}
  .bf-nav-item svg{width:17px;height:17px; flex-shrink:0;}
  .bf-nav-item:hover{background:var(--surface-alt); color:var(--text);}
  .bf-nav-item.active{background:var(--brand-green); color:#fff;}
 
  .bf-main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .bf-topbar{display:flex; align-items:center; gap:14px; padding:14px 24px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:30;}
  .bf-search{flex:1; max-width:420px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 12px;}
  .bf-search input{border:none; outline:none; background:none; color:var(--text); font-size:13px; width:100%;}
  .bf-search svg{width:15px;height:15px; color:var(--text-muted); flex-shrink:0;}
  .bf-topbar-title{font-family:'Space Grotesk'; font-weight:600; font-size:15px; margin-right:auto;}
  .bf-icon-btn{width:34px;height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); flex-shrink:0; position:relative;}
  .bf-icon-btn svg{width:16px;height:16px;}
  .bf-badge{position:absolute; top:-4px; right:-4px; background:var(--st-red); color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px;}
  .bf-notif-panel{position:absolute; top:52px; right:24px; width:320px; max-height:420px; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); z-index:90; padding:8px;}
  .bf-notif-item{padding:10px; border-radius:8px; cursor:pointer; font-size:12px;}
  .bf-notif-item:hover{background:var(--surface-alt);}
  .bf-notif-item b{font-size:12.5px;}
  .bf-notif-item p{color:var(--text-muted); margin:3px 0 0;}
 
  .bf-content{padding:22px 26px 60px;}
  .bf-kpi-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px; margin-bottom:26px;}
  .bf-kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:15px 16px; position:relative; overflow:hidden; box-shadow:var(--shadow);}
  .bf-kpi svg.leaf-wm{position:absolute; right:-10px; bottom:-14px; width:64px; height:64px; opacity:.06;}
  .bf-kpi-value{font-family:'Space Grotesk'; font-weight:700; font-size:26px; line-height:1;}
  .bf-kpi-label{font-size:11.5px; color:var(--text-muted); margin-top:6px; font-weight:500;}
  .bf-kpi-dot{width:8px;height:8px;border-radius:50%; display:inline-block; margin-right:6px;}
 
  .bf-section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .bf-section-title{font-family:'Space Grotesk'; font-weight:700; font-size:19px;}
  .bf-section-sub{color:var(--text-muted); font-size:12.5px; margin-top:2px;}
 
  .bf-btn{display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text);}
  .bf-btn:hover{filter:brightness(0.96);}
  [data-theme="dark"] .bf-btn:hover{filter:brightness(1.15);}
  .bf-btn svg{width:14px;height:14px;}
  .bf-btn-primary{background:var(--brand-green); border-color:var(--brand-green); color:#fff;}
  .bf-btn-orange{background:var(--st-orange); border-color:var(--st-orange); color:#fff;}
  .bf-btn-danger{background:var(--st-red); border-color:var(--st-red); color:#fff;}
  .bf-btn-sm{padding:6px 10px; font-size:11.5px;}
  .bf-btn-block{width:100%; justify-content:center;}
 
  .bf-chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px;}
  .bf-chip{padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);}
  .bf-chip.active{background:var(--text); color:var(--bg); border-color:var(--text);}
 
  .bf-card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(256px,1fr)); gap:14px;}
  .bf-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); border-top:4px solid var(--st-gray); display:flex; flex-direction:column;}
  .bf-card-img{height:118px; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .bf-card-img img{width:100%; height:100%; object-fit:cover;}
  .bf-card-body{padding:13px 14px 14px;}
  .bf-tag{font-family:'Space Grotesk'; font-weight:700; font-size:17px; letter-spacing:.01em;}
  .bf-card-badge{font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; color:#fff; white-space:nowrap;}
  .bf-card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .bf-card-meta{margin-top:8px; font-size:11.5px; color:var(--text-muted); display:grid; grid-template-columns:1fr 1fr; gap:4px 8px;}
  .bf-card-meta b{color:var(--text); font-weight:600;}
  .bf-timer-chip{margin-top:8px; display:flex; align-items:center; gap:5px; background:var(--surface-alt); border-radius:7px; padding:5px 8px; font-size:10.5px; color:var(--text-muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .bf-timer-chip svg{width:12px;height:12px; flex-shrink:0;}
  .bf-timer-chip .bf-timer-num{font-family:'IBM Plex Mono'; font-size:11.5px; font-weight:600; color:var(--text); margin-left:auto; flex-shrink:0;}
  .bf-timer-chip .bf-timer-label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bf-card-actions{display:flex; gap:7px; margin-top:11px;}
 
  @keyframes bfRedPulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(216,72,59,.45); }
    50%{ box-shadow: 0 0 0 5px rgba(216,72,59,0); }
  }
  .bf-card.bf-pulse-red{ animation: bfRedPulse 2.2s ease-in-out infinite; }
 
  .bf-hamburger{display:none; width:34px;height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface); align-items:center; justify-content:center; cursor:pointer; color:var(--text); flex-shrink:0;}
  .bf-hamburger svg{width:17px;height:17px;}
  .bf-sidebar-backdrop{display:none;}
 
  .bf-table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  table.bf-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.bf-table th{text-align:left; padding:11px 14px; background:var(--surface-alt); color:var(--text-muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;}
  table.bf-table td{padding:10px 14px; border-top:1px solid var(--border); vertical-align:middle;}
  table.bf-table tr:hover td{background:var(--surface-alt);}
  .bf-status-pill{padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700; color:#fff; display:inline-block; white-space:nowrap;}
 
  .bf-overlay-center{position:fixed; inset:0; background:rgba(10,14,11,.5); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:120; padding:20px; animation:bfFade .15s ease;}
  @keyframes bfFade{from{opacity:0} to{opacity:1}}
  .bf-modal{width:min(560px,100%); max-height:92vh; overflow-y:auto; background:var(--bg); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); animation:bfPop .18s ease;}
  @keyframes bfPop{from{transform:scale(.97); opacity:.7} to{transform:scale(1); opacity:1}}
  .bf-modal-head{display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg);}
  .bf-modal-close{margin-left:auto; width:28px;height:28px;border-radius:8px;border:1px solid var(--border); background:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .bf-modal-body{padding:18px 20px 24px;}
  .bf-field{margin-bottom:12px;}
  .bf-field label{display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); margin-bottom:5px;}
  .bf-field input, .bf-field select, .bf-field textarea{width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:12.5px; font-family:inherit;}
  .bf-field textarea{resize:vertical; min-height:56px;}
  .bf-field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
  .bf-radio-group{display:flex; gap:16px;}
  .bf-radio-opt{display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer;}
  .bf-divider{display:flex; align-items:center; gap:10px; margin:16px 0 10px;}
  .bf-divider b{font-family:'Space Grotesk'; font-weight:700; font-size:12.5px; white-space:nowrap; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em;}
  .bf-divider .line{height:1px; background:var(--border); flex:1;}
  .bf-photo-row{display:flex; gap:8px; flex-wrap:wrap;}
  .bf-photo-btn{flex:1; min-width:150px; border:1.5px dashed var(--border); border-radius:10px; padding:14px 8px; text-align:center; cursor:pointer; background:var(--surface); font-size:11.5px; font-weight:600;}
  .bf-photo-btn svg{width:18px;height:18px; margin-bottom:5px; color:var(--text-muted);}
  .bf-photo-btn.has-photo{border-style:solid; border-color:var(--st-green);}
  .bf-photo-thumb{width:100%; height:70px; object-fit:cover; border-radius:8px; margin-bottom:6px;}
 
  .bf-timeline{position:relative; padding-left:22px;}
  .bf-timeline::before{content:'';position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--border);}
  .bf-tl-item{position:relative; padding-bottom:16px;}
  .bf-tl-item:last-child{padding-bottom:0;}
  .bf-tl-dot{position:absolute; left:-22px; top:2px; width:12px;height:12px;border-radius:50%; background:var(--brand-green); border:2px solid var(--bg);}
  .bf-tl-date{font-size:10.5px; color:var(--text-muted); font-family:'IBM Plex Mono';}
  .bf-tl-title{font-size:12.5px; font-weight:600; margin-top:1px;}
  .bf-tl-user{font-size:11px; color:var(--text-muted); margin-top:1px;}
 
  .bf-drop{border:1.5px dashed var(--border); border-radius:var(--radius); padding:34px 20px; text-align:center; background:var(--surface); cursor:pointer;}
  .bf-drop svg{width:30px;height:30px; color:var(--text-muted); margin-bottom:8px;}
  .bf-drop b{font-size:13.5px;} .bf-drop p{font-size:11.5px; color:var(--text-muted); margin-top:4px;}
 
  .bf-empty{padding:50px 20px; text-align:center; color:var(--text-muted); font-size:13px;}
  .bf-empty svg{width:34px;height:34px; margin-bottom:10px; opacity:.5;}
 
  .bf-reg-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .bf-reg-row:last-child{border-bottom:none;}
  .bf-reg-thumb{width:40px;height:40px;border-radius:8px; background:var(--surface-alt); overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .bf-reg-thumb img{width:100%;height:100%;object-fit:cover;}
  .bf-x{cursor:pointer; color:var(--text-muted); width:15px;height:15px; flex-shrink:0;}
  .bf-x:hover{color:var(--st-red);}
 
  .bf-toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:9px; font-size:12.5px; font-weight:600; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.25);}
 
  .bf-import-table-wrap{overflow-x:auto;}
  .bf-import-table td, .bf-import-table th{white-space:nowrap;}
  .bf-mini-select{padding:5px 7px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:11px; max-width:130px;}
  .bf-mini-thumb{width:34px;height:34px;border-radius:6px; overflow:hidden; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .bf-mini-thumb img{width:100%;height:100%;object-fit:cover;}
 
  @media (max-width:860px){
    .bf-hamburger{display:flex;}
    .bf-sidebar{position:fixed; left:0; top:0; z-index:70; transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow);}
    .bf-sidebar.open{transform:translateX(0);}
    .bf-sidebar-backdrop.open{display:block; position:fixed; inset:0; background:rgba(10,14,11,.4); z-index:65;}
    .bf-topbar{padding:12px 14px; gap:8px;}
    .bf-topbar-title{display:none;}
    .bf-search{max-width:none;}
    .bf-search input{font-size:12px;}
    .bf-content{padding:16px 14px 50px;}
    .bf-kpi-grid{grid-template-columns:repeat(2,1fr); gap:9px;}
    .bf-card-grid{grid-template-columns:1fr;}
    .bf-field-grid{grid-template-columns:1fr;}
    .bf-notif-panel{right:10px; left:10px; width:auto;}
    .bf-modal{width:100%;}
    table.bf-table{font-size:11.5px;}
    .bf-table-wrap{overflow-x:auto;}
  }
  @media (min-width:861px) and (max-width:1180px){
    .bf-kpi-grid{grid-template-columns:repeat(3,1fr);}
    .bf-card-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
  }
</style>

  /* ---------------- STORAGE (Firebase Firestore, tempo real, sem login) ---------------- */
  function loadTheme(){ try{ const t=localStorage.getItem('bf-theme'); if(t) state.theme=t; }catch(e){} }

    const keys = Object.keys(DOCS);
    await Promise.all(keys.map(async k=>{
      try{
        const snap = await db.collection(COL).doc(DOCS[k]).get();
        if(snap.exists){ const d=snap.data(); state[k]= d.value ? JSON.parse(d.value) : (k==='models'?{}:[]); }

    state.loaded=true; render();
    setInterval(tickTimers, 1000);
    attachRealtimeListeners();
  }
  function attachRealtimeListeners(){
    Object.keys(DOCS).forEach(k=>{
      db.collection(COL).doc(DOCS[k]).onSnapshot(snap=>{
        if(!snap.exists) return;
        const d = snap.data();
        const parsed = d.value ? JSON.parse(d.value) : (k==='models'?{}:[]);
        if(JSON.stringify(parsed) === JSON.stringify(state[k])) return;
        state[k] = parsed;
        flushOrDeferRender();
      }, err=>console.error('Listener erro', k, err));
    });

    const busy = state.checklistModalAssetId || state.finalizeAssetId || state.historicoOpenId || state.importRows || isUserEditing();

        deferredRenderPending = true;
        const check = setInterval(()=>{
          const stillBusy = state.checklistModalAssetId || state.finalizeAssetId || state.historicoOpenId || state.importRows || isUserEditing();

  function fmtMs(ms){
    if(ms<0) ms=0;
    const s=Math.floor(ms/1000); const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=s%60;
    return [h,m,sec].map(n=>String(n).padStart(2,'0')).join(':');
  }

    return list[0]||null;
  }
  function daysSince(ts){ if(!ts) return null; return Math.floor((Date.now()-ts)/86400000); }
  function checklistOverdueDays(a){
    const last = lastFinishedChecklistOf(a);
    const ref = last ? last.fimTs : (a.addedTs||Date.now());
    return daysSince(ref);
  }
  function checklistAlerts(){
    return state.assets.filter(a=>{

  }

  /* ---------------- IMPORTAR ATIVOS ---------------- */
  const IMPORT_FIELDS = {tag:['tag'], descricao:['descricao'], modelo:['modelo'], placa:['placa'], ano:['ano']};
  function mapHeadersExact(headerRow){
    const map = {};
    headerRow.forEach((raw, idx)=>{
      const h = normalize(raw);
      Object.entries(IMPORT_FIELDS).forEach(([field,pats])=>{
        if(map[field]===undefined && pats.includes(h)) map[field]=idx;
      });
    });
    return map;
  }
  function findHeaderRowExact(rows){
    let bestIdx=0, bestScore=-1;
    for(let i=0;i<Math.min(rows.length,10);i++){
      const score = Object.keys(mapHeadersExact(rows[i]||[])).length;
      if(score>bestScore){bestScore=score; bestIdx=i;}
    }
    return bestIdx;
  }

          <td><label class="bf-mini-thumb">${state.models[a.modelo]?`<img src="${state.models[a.modelo]}"/>`:ICONS.truck}<input type="file" accept="image/*" data-saved-img="${esc(a.modelo)}" style="display:none;"/></label></td>
          <td class="mono">${esc(a.tag)}</td><td>${esc(a.descricao)}</td><td>${esc(a.modelo)}</td><td class="mono">${esc(a.placa)}</td><td class="mono">${esc(a.ano)}</td>
          <td><select class="bf-mini-select" data-saved-condutor="${a.id}"><option value="">—</option>${state.condutores.map(c=>`<option value="${c.id}" ${a.condutorId===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></td>

      </table></div>` : '';
 
    return `<div>
      <div class="bf-drop" id="bf-drop" style="max-width:600px;">${ICONS.upload}<div><b>Clique para selecionar a planilha de ativos</b></div><p>O sistema reconhece automaticamente apenas: TAG, Descrição, Modelo, Placa, Ano. As demais colunas são ignoradas.</p><input type="file" id="bf-file-input" accept=".xlsx,.xls,.csv" style="display:none"/></div>
      ${pending}
      ${savedTable || (state.importRows? '' : `<div class="bf-section-sub" style="margin-top:14px;">Depois de importar, associe uma imagem por modelo (compartilhada entre todos os veículos daquele modelo) e um condutor por veículo. Essas associações permanecem salvas mesmo em novas importações.</div>`)}
    </div>`;

  function handleImportFile(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
        const headerIdx = findHeaderRowExact(raw);
        const map = mapHeadersExact(raw[headerIdx]||[]);
        const dataRows = raw.slice(headerIdx+1).filter(r=>r.some(c=>String(c||'').trim()!==''));
        const rows = dataRows.map(r=>{
          const rec = {};
          Object.entries(map).forEach(([field,idx])=>{ rec[field]=String(r[idx]||'').trim(); });
          const existing = state.assets.find(a=> rec.tag && a.tag===rec.tag);
          rec.condutorId = existing ? existing.condutorId : '';
          return rec;
        }).filter(r=>r.tag);
        if(!rows.length){ toast('Não encontrei as colunas TAG/Descrição/Modelo/Placa/Ano nesta planilha.'); return; }
        state.importRows = rows; state.importMap = map; render();
      }catch(err){ toast('Não foi possível ler o arquivo.'); }
    };
    reader.readAsArrayBuffer(file);
  }

  /* ---------------- EVENTS ---------------- */
  function bindEvents(){
    ROOT.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{ state.view=el.dataset.nav; state.importRows=null; state.notifOpen=false; state.sidebarOpen=false; render(); }));

    const searchInput=ROOT.querySelector('#bf-search-input'); if(searchInput) searchInput.addEventListener('input',(e)=>{ state.search=e.target.value; render(); const el=ROOT.querySelector('#bf-search-input'); if(el){el.focus(); el.setSelectionRange(state.search.length,state.search.length);} });
    ROOT.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click', ()=>{ state.filter=el.dataset.filter; render(); }));
    const descSel = ROOT.querySelector('#bf-filter-descricao'); if(descSel) descSel.addEventListener('change', ()=>{ state.filterDescricao=descSel.value; render(); });
 
    const notifBtn = ROOT.querySelector('#bf-notif-btn'); if(notifBtn) notifBtn.addEventListener('click',(e)=>{ e.stopPropagation(); state.notifOpen=!state.notifOpen; render(); });
    ROOT.querySelectorAll('[data-notif]').forEach(el=>el.addEventListener('click', ()=>{
      const al = allAlerts()[+el.dataset.notif];
      state.notifOpen=false;
      if(al.type==='checklist'){ state.view='frota'; state.search=al.asset.tag; }
      else { state.view='solicitacoes'; state.search=''; }
      render();
    }));
 
    // start / edit / finalize checklist
    ROOT.querySelectorAll('[data-start-checklist],[data-edit-checklist]').forEach(el=>el.addEventListener('click', ()=>{
      state.checklistModalAssetId = el.dataset.startChecklist || el.dataset.editChecklist; render();
    }));
    ROOT.querySelectorAll('[data-finalize]').forEach(el=>el.addEventListener('click', ()=>{ state.finalizeAssetId = el.dataset.finalize; render(); }));
    const clClose = ROOT.querySelector('#bf-checklist-close'); if(clClose) clClose.addEventListener('click', ()=>{ state.checklistModalAssetId=null; render(); });
    const clOverlay = ROOT.querySelector('#bf-checklist-overlay'); if(clOverlay) clOverlay.addEventListener('click',(e)=>{ if(e.target===clOverlay){ state.checklistModalAssetId=null; render(); } });
 
    ROOT.querySelectorAll('input[name="cl-terc"]').forEach(el=>el.addEventListener('change',()=>{
      const wrap = ROOT.querySelector('#cl-terc-motivo-wrap'); if(wrap) wrap.style.display = (ROOT.querySelector('input[name="cl-terc"]:checked').value==='sim')?'block':'none';
    }));
    ROOT.querySelectorAll('input[name="cl-pecas"]').forEach(el=>el.addEventListener('change',()=>{
      const wrap = ROOT.querySelector('#cl-pecas-foto-wrap'); if(wrap) wrap.style.display = (ROOT.querySelector('input[name="cl-pecas"]:checked').value==='sim')?'flex':'none';
    }));
    ROOT.querySelectorAll('[data-photo]').forEach(el=>el.addEventListener('change', (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{ el.closest('.bf-photo-btn').classList.add('has-photo'); el.dataset.dataurl = r.result; const img=document.createElement('img'); img.className='bf-photo-thumb'; img.src=r.result; el.closest('.bf-photo-btn').prepend(img); const camIcon = el.closest('.bf-photo-btn').querySelector('svg'); if(camIcon) camIcon.remove(); };
      r.readAsDataURL(f);
    }));
 
    const clSave = ROOT.querySelector('#bf-checklist-save');
    if(clSave) clSave.addEventListener('click', ()=>{
      const a = state.assets.find(x=>x.id===state.checklistModalAssetId);
      if(!a) return;
      const numero = ROOT.querySelector('#cl-numero').value.trim();
      if(!numero){ toast('Informe o número do checklist'); return; }
      const executante = ROOT.querySelector('#cl-executante').value.trim();
      const observacoes = ROOT.querySelector('#cl-observacoes').value;
      const tercSim = ROOT.querySelector('input[name="cl-terc"]:checked').value==='sim';
      const tercMotivo = ROOT.querySelector('#cl-terc-motivo') ? ROOT.querySelector('#cl-terc-motivo').value : '';
      const pecasSim = ROOT.querySelector('input[name="cl-pecas"]:checked').value==='sim';
      const getPhoto = (key, prevVal)=>{ const el = ROOT.querySelector(`[data-photo="${key}"]`); return el && el.dataset.dataurl ? el.dataset.dataurl : prevVal; };
 
      let c = activeChecklistOf(a);
      if(!c){
        const np = nowParts();
        c = {id:uid(), assetId:a.id, numero, executante, observacoes, status:'andamento',
          terceirizacao:{sim:tercSim, motivo:tercMotivo}, solicitacaoPecas:{sim:pecasSim},
          fotos:{checklist:getPhoto('checklist'), os:getPhoto('os'), solicitacaoPecas:getPhoto('solicitacaoPecas')},
          inicioData:np.data, inicioHora:np.hora, inicioTs:Date.now()};
        state.checklists.push(c);
        a.checklistAtual = c.id; a.status='checklist'; a.addedTs = a.addedTs||Date.now();
        if(pecasSim){
          const sp = {id:uid(), assetId:a.id, checklistId:c.id, numero:'', data:np.data, status:'Pendente', createdTs:Date.now(), historico:[]};
          addSolicHistory(sp,'Pendente');
          state.solicitacoes.push(sp);
          saveSolic();
        }
        toast('Checklist iniciado');
      } else {
        c.executante = executante; c.observacoes = observacoes;
        c.terceirizacao = {sim:tercSim, motivo:tercMotivo};
        const wasPecas = c.solicitacaoPecas.sim;
        c.solicitacaoPecas = {sim:pecasSim};
        c.fotos = {checklist:getPhoto('checklist',c.fotos.checklist), os:getPhoto('os',c.fotos.os), solicitacaoPecas:getPhoto('solicitacaoPecas',c.fotos.solicitacaoPecas)};
        if(pecasSim && !wasPecas){
          const np = nowParts();
          const sp = {id:uid(), assetId:a.id, checklistId:c.id, numero:'', data:np.data, status:'Pendente', createdTs:Date.now(), historico:[]};
          addSolicHistory(sp,'Pendente');
          state.solicitacoes.push(sp); saveSolic();
        }
        toast('Checklist atualizado');
      }
      state.checklistModalAssetId=null;
      saveChecklists(); saveAssets(); render();
    });
 
    const fzCancel = ROOT.querySelector('#bf-finalize-cancel'); if(fzCancel) fzCancel.addEventListener('click', ()=>{ state.finalizeAssetId=null; render(); });
    const fzClose = ROOT.querySelector('#bf-finalize-close'); if(fzClose) fzClose.addEventListener('click', ()=>{ state.finalizeAssetId=null; render(); });
    const fzConfirm = ROOT.querySelector('#bf-finalize-confirm');
    if(fzConfirm) fzConfirm.addEventListener('click', ()=>{
      const a = state.assets.find(x=>x.id===state.finalizeAssetId);
      const c = activeChecklistOf(a);
      if(c){ const np=nowParts(); c.fimData=np.data; c.fimHora=np.hora; c.fimTs=Date.now(); c.tempoTotalMs=c.fimTs-c.inicioTs; c.status='finalizado'; }
      a.checklistAtual=null; a.status='rodando';
      state.finalizeAssetId=null;
      saveChecklists(); saveAssets(); render();
      toast('Veículo liberado com sucesso.');
    });
 
    // historico filters
    ROOT.querySelectorAll('[data-cf]').forEach(el=>el.addEventListener('input', ()=>{ state.checklistFilters[el.dataset.cf]=el.value; render(); }));
    ROOT.querySelectorAll('[data-hist-open]').forEach(el=>el.addEventListener('click', ()=>{ state.historicoOpenId=el.dataset.histOpen; render(); }));
    const histClose = ROOT.querySelector('#bf-hist-close'); if(histClose) histClose.addEventListener('click', ()=>{ state.historicoOpenId=null; render(); });
    const histOverlay = ROOT.querySelector('#bf-hist-overlay'); if(histOverlay) histOverlay.addEventListener('click',(e)=>{ if(e.target===histOverlay){ state.historicoOpenId=null; render(); } });
 
    // solicitacoes
    ROOT.querySelectorAll('[data-solic-status]').forEach(el=>el.addEventListener('change', ()=>{
      const s = state.solicitacoes.find(x=>x.id===el.dataset.solicStatus);
      if(s && s.status!==el.value){ addSolicHistory(s, el.value); s.status=el.value; saveSolic(); render(); toast('Status atualizado'); }
    }));
    ROOT.querySelectorAll('[data-solic-numero]').forEach(el=>el.addEventListener('change', ()=>{
      const s = state.solicitacoes.find(x=>x.id===el.dataset.solicNumero);
      if(s){ s.numero = el.value.trim(); saveSolic(); }
    }));
 
    // import
    const drop = ROOT.querySelector('#bf-drop'); const fileInput = ROOT.querySelector('#bf-file-input');
    if(drop) drop.addEventListener('click', ()=>fileInput.click());
    if(fileInput) fileInput.addEventListener('change', (e)=>{ if(e.target.files[0]) handleImportFile(e.target.files[0]); });
    ROOT.querySelectorAll('[data-import-img]').forEach(el=>el.addEventListener('change', (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const idx = +el.dataset.importImg; const modelo = state.importRows[idx].modelo;
      const r = new FileReader(); r.onload = ()=>{ state.models[modelo]=r.result; render(); }; r.readAsDataURL(f);
    }));
    ROOT.querySelectorAll('[data-import-condutor]').forEach(el=>el.addEventListener('change', ()=>{ state.importRows[+el.dataset.importCondutor].condutorId = el.value; }));
    const saveImportBtn = ROOT.querySelector('#bf-save-import');
    if(saveImportBtn) saveImportBtn.addEventListener('click', async ()=>{
      state.importRows.forEach(r=>{
        let a = state.assets.find(x=>x.tag===r.tag);
        if(!a){ a={id:uid(), tag:r.tag, addedTs:Date.now(), status:'rodando', checklistAtual:null}; state.assets.push(a); }
        a.descricao=r.descricao; a.modelo=r.modelo; a.placa=r.placa; a.ano=r.ano; a.condutorId=r.condutorId||a.condutorId||'';
      });
      await saveAssets(); await saveModels();
      state.importRows=null; state.importMap=null; render();
      toast('Ativos importados e salvos');
    });
    const cancelImportBtn = ROOT.querySelector('#bf-cancel-import');
    if(cancelImportBtn) cancelImportBtn.addEventListener('click', ()=>{ state.importRows=null; state.importMap=null; render(); });
    ROOT.querySelectorAll('[data-saved-img]').forEach(el=>el.addEventListener('change', (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const modelo = el.dataset.savedImg;
      const r = new FileReader(); r.onload = ()=>{ state.models[modelo]=r.result; saveModels(); render(); }; r.readAsDataURL(f);
    }));
    ROOT.querySelectorAll('[data-saved-condutor]').forEach(el=>el.addEventListener('change', ()=>{
      const a = state.assets.find(x=>x.id===el.dataset.savedCondutor);
      if(a){ a.condutorId = el.value; saveAssets(); }
    }));
 
    // condutores
    const condSearch = ROOT.querySelector('#bf-condutor-search'); if(condSearch) condSearch.addEventListener('input', (e)=>{ state.condutorSearch=e.target.value; render(); });
    const addCondBtn = ROOT.querySelector('#bf-add-condutor');
    if(addCondBtn) addCondBtn.addEventListener('click', ()=>{
      const name = ROOT.querySelector('#new-condutor-name').value.trim();
      if(!name) return;
      state.condutores.push({id:uid(), nome:name}); saveCondutores(); render();
    });
    ROOT.querySelectorAll('[data-condutor-edit]').forEach(el=>el.addEventListener('change', ()=>{
      const c = state.condutores.find(x=>x.id===el.dataset.condutorEdit); if(c){ c.nome=el.value.trim(); saveCondutores(); }
    }));
    ROOT.querySelectorAll('[data-del-condutor]').forEach(el=>el.addEventListener('click', ()=>{
      state.condutores = state.condutores.filter(c=>c.id!==el.dataset.delCondutor); saveCondutores(); render();
    }));
 
    // config
    ROOT.querySelectorAll('[data-set-theme]').forEach(el=>el.addEventListener('click', ()=>{ state.theme=el.dataset.setTheme; saveTheme(); render(); }));
    const clearBtn = ROOT.querySelector('#bf-clear-all');
    if(clearBtn) clearBtn.addEventListener('click', async ()=>{
      const conf = window.prompt('Esta ação apagará TODOS os dados (ativos, checklists, solicitações, condutores e imagens) e não pode ser desfeita.\n\nDigite CONFIRMAR para prosseguir:');
      if(conf==='CONFIRMAR'){
        state.assets=[]; state.checklists=[]; state.solicitacoes=[]; state.condutores=[]; state.models={};
        await saveAssets(); await saveChecklists(); await saveSolic(); await saveCondutores(); await saveModels();
        toast('Todos os dados foram apagados'); state.view='dashboard'; render();
      }
    });
 
    document.addEventListener('click', function closeNotif(e){
      if(state.notifOpen && !e.target.closest('#bf-notif-panel') && !e.target.closest('#bf-notif-btn')){ state.notifOpen=false; render(); }
    }, {once:true});
  }
 
  loadState();
})();
</script>
